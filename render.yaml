services:
  - type: web
    name: skypulse-weather-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEATHER_NOTIFICATIONS_WORKER_URL
        sync: false
      - key: WEATHER_NOTIFICATIONS_SHARED_SECRET
        sync: false
      - key: PRO_MONTHLY_PRICE_STARS
        value: 10
      - key: PRO_PAYMENTS_ENABLED
        value: true
      - key: PAYMENT_SUPPORT_USERNAME
        value: pitrparkeryouoi
      - key: COMPLIMENTARY_PRO_USER_IDS
        sync: false
      - key: COMPLIMENTARY_PRO_USERNAME_GIFTS
        sync: false
