services:
  - type: web
    name: skypulse-weather-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEATHER_NOTIFICATIONS_WORKER_URL
        sync: false
      - key: WEATHER_NOTIFICATIONS_SHARED_SECRET
        sync: false
