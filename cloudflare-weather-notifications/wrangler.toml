[triggers]
crons = ["0 */3 * * *"]

[vars]
RENDER_DELIVERY_URL = "https://skypulse-weather-bot.onrender.com/internal/weather-notifications/deliver"

[[d1_databases]]
binding = "DB"
database_name = "skypulse-weather-notifications"
